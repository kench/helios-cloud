name: Deploy

# Deploys the HeliosCloud stack to the AWS account. It runs only when started
# by hand, from main (Actions tab, or `gh workflow run deploy.yml --ref main`):
# merging a PR never deploys by itself.

on:
  workflow_dispatch:

permissions:
  id-token: write # for the OIDC token that AWS exchanges for credentials
  contents: read

# One deploy at a time. A second run waits instead of cancelling one in
# progress, which could leave CloudFormation mid-update.
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: cdk

env:
  # The account's GitHub Actions role, shared with Kenley/CDK. Its trust policy
  # must allow this repository's immutable OIDC subject for main:
  # repo:kench@34564/helios-cloud@1463717924:ref:refs/heads/main
  AWS_ROLE_ARN: arn:aws:iam::857247606239:role/GitHubActionsRole
  AWS_REGION: us-west-2

jobs:
  deploy:
    name: Deploy HeliosCloud
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: cdk/.nvmrc
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI already passed for this commit (branch protection), but a deploy
      # should never go out from a tree that doesn't build or test.
      - name: Type-check and test
        run: |
          npm run build
          npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: helios-cloud-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Logged so that each run shows what it changed.
      - name: Diff
        run: npx cdk diff HeliosCloud

      - name: Deploy
        run: npx cdk deploy HeliosCloud --require-approval never
